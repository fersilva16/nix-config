# status
set -g status "on"
set -g status-bg $color_bg_2
set -g status-justify "left"
set -g status-left-length "100"
set -g status-right-length "100"

# messages
set -g message-style fg=$color_cyan,bg=$color_tx_1,align="centre"
set -g message-command-style fg=$color_cyan,bg=$color_ui_3,align="centre"

# panes
set -g pane-border-style fg=$color_ui_3
set -g pane-active-border-style fg=$color_blue

# windows
setw -g window-status-activity-style fg=$color_tx_1,bg=$color_bg_1,none
setw -g window-status-separator ""
setw -g window-status-style fg=$color_tx_1,bg=$color_bg_1,none

# statusline
set -g status-left "#{?client_prefix,#[fg=#$color_bg_2#,bg=#$color_orange],#[fg=#$color_orange#,bg=#$color_bg_2]} λ #S #{W:#{?#{==:#{@nvim_window},1},#{?#{window_active},#[bg=#$color_bg_1],#[bg=#$color_bg_2]}#{?#{pane_dead},#[fg=#$color_ui_3],#[fg=#$color_blue]}  #[bg=#$color_bg_2],}}"
# status-right is set in tmux.nix extraConfig (after all plugins load)

# window-status
# The nvim window (tagged @nvim_window) is hidden from the window list and
# drawn in status-left instead — it's the session's general-purpose editor,
# not one of the numbered windows, and this way real windows keep prefix+1..N
# even while it doesn't exist. Styles are split into separate #[] blocks
# because a comma inside #[] would terminate the #{?...} branch.
#
# A window whose opencode session is generating is drawn in purple. @oc-status
# is a pane option, but tmux resolves it against the window's active pane when
# expanding window-status-format, so no script or polling is needed. Updates
# land on the next status-interval tick (5s) — see tmux.nix.
setw -g window-status-format "#{?#{==:#{@nvim_window},1},,#[bg=#$color_bg_2]#{?#{==:#{@oc-status},busy},#[fg=#$color_purple],#[fg=#$color_tx_3]} #I #W }"
setw -g window-status-current-format "#{?#{==:#{@nvim_window},1},,#[bg=#$color_bg_1]#{?#{==:#{@oc-status},busy},#[fg=#$color_purple],#[fg=#$color_tx_1]} #I #W }"

# Modes
setw -g clock-mode-colour $color_blue
setw -g mode-style fg=$color_magenta,bg=$color_tx_1,bold
