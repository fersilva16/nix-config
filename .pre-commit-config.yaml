# The devShell runs `pre-commit install -f`; install the pre-push hook too.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - name: prettier-yaml
        id: prettier-yaml
        types: [yaml]
        language: system
        entry: prettier --write

      - name: shellcheck
        id: shellcheck
        files: '\.sh$'
        language: system
        entry: shellcheck

      - name: nixfmt
        id: nixfmt
        files: '\.nix$'
        language: system
        entry: nixfmt

      - name: statix
        id: statix
        pass_filenames: false
        language: system
        entry: statix check .

      # The pushing machine's checks only: each host's eval-<host> plus its Lua
      # checks. Every host evaluates from any machine, but the Lua checks build
      # that host's generated files, which needs its platform's builder: vega
      # has no x86_64-linux one, polaris no aarch64-darwin one. So a
      # polaris-only error surfaces on the next push from polaris.
      # git+file, not a bare path: a path copies .git too, and Nix cannot copy
      # the git fsmonitor sockets there.
      - name: nix checks (this system)
        id: nix-checks
        pass_filenames: false
        stages: [pre-push]
        language: system
        entry: nix build --impure --no-link --expr 'builtins.attrValues (builtins.getFlake ("git+file://" + toString ./.)).checks.${builtins.currentSystem}'
