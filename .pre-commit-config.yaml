# The devShell runs `pre-commit install -f`; install the pre-push hook too.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - name: prettier-yaml
        id: prettier-yaml
        types: [yaml]
        language: system
        entry: prettier --write

      - name: shellcheck
        id: shellcheck
        files: '\.sh$'
        language: system
        entry: shellcheck

      - name: nixfmt
        id: nixfmt
        files: '\.nix$'
        language: system
        entry: nixfmt

      - name: statix
        id: statix
        pass_filenames: false
        language: system
        entry: statix check .

      # Evaluates every host from any machine: nixosConfigurations are not
      # keyed by system, so a darwin-only option leaking into polaris fails
      # here on vega. Pre-push, not pre-commit: it evaluates both hosts.
      - name: nix flake check
        id: nix-flake-check
        pass_filenames: false
        stages: [pre-push]
        language: system
        entry: nix flake check
