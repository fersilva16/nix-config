# The devShell runs `pre-commit install -f`; install the pre-push hook too.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - name: prettier-yaml
        id: prettier-yaml
        types: [yaml]
        language: system
        entry: prettier --write

      - name: shellcheck
        id: shellcheck
        files: '\.sh$'
        language: system
        entry: shellcheck

      - name: nixfmt
        id: nixfmt
        files: '\.nix$'
        language: system
        entry: nixfmt

      - name: statix
        id: statix
        pass_filenames: false
        language: system
        entry: statix check .

      # The pushing machine's checks only: each host's eval-<host> plus its Lua
      # checks. Not `nix flake check`, which evaluates nixosConfigurations from
      # any machine: limi-suite's crate2nix import-from-derivation then needs
      # an x86_64-linux build on vega, which has no linux builder. So a
      # polaris-only eval error surfaces on the next push from polaris.
      - name: nix checks (this system)
        id: nix-checks
        pass_filenames: false
        stages: [pre-push]
        language: system
        entry: nix build --impure --no-link --expr 'builtins.attrValues (builtins.getFlake (toString ./.)).checks.${builtins.currentSystem}'
